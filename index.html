<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenMind | GenAI Green Campus Assistant</title>
  <meta http-equiv="refresh" content="0; url=/Green-Minds/login/">
  <script>
    // Smooth instant redirection to GreenMind Login Portal
    if (window.location.pathname === '/Green-Minds' || window.location.pathname === '/Green-Minds/') {
      window.location.replace('/Green-Minds/login/');
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0A160F;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #122419;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      font-size: 14px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #34d399;
      transform: translateY(-2px);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 style="margin: 0 0 8px 0; font-size: 22px; font-weight: 900; color: #fff;">🌿 GreenMind</h1>
    <p style="margin: 0; font-size: 13px; color: #a7f3d0; line-height: 1.5;">
      Loading Green Campus Sustainability Platform...
    </p>
    <a href="/Green-Minds/login/" class="btn">
      Enter GreenMind Portal &rarr;
    </a>
  </div>
</body>
</html>
