name: Deploy to AWS EC2 via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/greenmind:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/greenmind:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment on EC2 instance..."

            # Ensure Docker is installed and running
            command -v docker >/dev/null 2>&1 || {
              echo "⚠️ Docker not found. Installing Docker engine..."
              sudo apt-get update && sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            }

            # Optional: Log in to Docker Hub on EC2 (required for private repositories)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true

            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/greenmind:latest"
            CONTAINER_NAME="greenmind-app"

            echo "📥 Pulling latest Docker image: ${IMAGE_NAME}..."
            docker pull "${IMAGE_NAME}"

            echo "🛑 Stopping and removing existing container (if running)..."
            docker stop "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true

            echo "▶️ Launching new container mapping host port 80 to container port 3000..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p 80:3000 \
              "${IMAGE_NAME}"

            echo "🧹 Pruning unused dangling images..."
            docker image prune -f || true

            echo "🩺 Verifying container health on port 80..."
            sleep 5
            curl -f http://localhost:80/ || {
              echo "⚠️ Health check warning: Waiting another 5 seconds for application startup..."
              sleep 5
              curl -f http://localhost:80/
            }

            echo "✅ Deployment completed successfully! Application is live on port 80."
